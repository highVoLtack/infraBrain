server {
    listen 80;

    # Use Docker embedded DNS resolver for runtime resolution
    resolver 127.0.0.11 valid=5s;

    location / {
        # Variable forces Nginx to resolve at request time (not startup)
        # This lets Nginx start even when "backend" is unreachable
        set $upstream backend;
        proxy_pass http://$upstream:80;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
