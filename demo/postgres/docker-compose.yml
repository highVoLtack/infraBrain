services:
  postgres:
    image: postgres:16
    container_name: postgres-demo
    ports:
      - "5433:5432"
    command: postgres -c max_connections=20 -c superuser_reserved_connections=2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./leaky-app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pgnet

  leaky-app:
    build: ./leaky-app
    container_name: leaky-app
    depends_on:
      - postgres
    networks:
      - pgnet

networks:
  pgnet:
    driver: bridge
